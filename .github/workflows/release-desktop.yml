# 推送 v* tag 时在 Windows / Linux 上打包桌面端，产物上传到草稿 Release。
# 发版：改 src-tauri/tauri.conf.json 的 version → 提交 → git tag v0.2.0 → git push origin v0.2.0
name: Release desktop

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: NotebookPi ${{ github.ref_name }}
          releaseBody: |
            Windows：下载 `.msi` 或 `-setup.exe` 安装（未签名，SmartScreen 提示时点「更多信息 → 仍要运行」）。
            Linux：`.deb`（Debian/Ubuntu）或 `.AppImage`（`chmod +x` 后直接运行）。
          releaseDraft: true
          prerelease: false
